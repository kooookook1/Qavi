[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qavi-phone-cli"
version = "0.1.0"
description = "Command-line client for Qavi's Android task API"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
qavi = "qavi_cli:main"

[tool.setuptools]
py-modules = ["qavi_cli", "qavi_notifications"]
packages = ["qavi_desk"]
package-dir = {"" = "scripts"}

[tool.setuptools.package-data]
qavi_desk = ["*.html", "*.css", "*.js", "qavi-logo.png"]
