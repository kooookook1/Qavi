name: Qavi Build (bootstrap)

# One-shot bootstrap: fetch the pristine Mika v0.1.42 source, rename it to
# Qavi with rename.sh, build the debug APK, publish it as a prerelease, and
# commit the renamed source back to main as an overlay commit. The overlay
# never touches .github (the Actions token may not push workflow files);
# the standing qavi-apk.yml workflow is installed separately afterwards.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: qavi-bootstrap
  cancel-in-progress: false

jobs:
  build:
    name: Rename, build and publish Qavi
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Fetch upstream v0.1.42 source into src/
        run: |
          set -euo pipefail
          curl -sL -o /tmp/mika.tar.gz https://codeload.github.com/wangzan101/Mika/tar.gz/refs/tags/v0.1.42
          mkdir -p src
          tar -xzf /tmp/mika.tar.gz -C src --strip-components=1
          ls src | head

      - name: Rename Mika to Qavi
        run: bash rename.sh

      - name: Point updater and doc links at this repository
        run: |
          set -euo pipefail
          grep -rIl -e 'qavi-app/qavi' -e 'wangzan101/Qavi' src \
            | xargs -r sed -i "s|qavi-app/qavi|${GITHUB_REPOSITORY}|g; s|wangzan101/Qavi|${GITHUB_REPOSITORY}|g"
          grep -rn 'qavi-app/qavi' src --include='*.kt' || echo "placeholder fully replaced"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build Qavi debug APK
        working-directory: src
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Prepare release asset
        run: |
          set -euo pipefail
          mkdir -p dist
          cp src/app/build/outputs/apk/debug/app-debug.apk dist/Qavi.apk
          (cd dist && sha256sum Qavi.apk > SHA256SUMS.txt)
          ls -la dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Qavi-APK
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish prerelease with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="qavi-test-${GITHUB_SHA::7}"
          gh release create "$tag" dist/Qavi.apk dist/SHA256SUMS.txt \
            --title "Qavi test build (${tag})" \
            --notes "Automated bootstrap build: Mika v0.1.42 fully renamed to Qavi (package co.qavi). Debug APK for on-device testing." \
            --prerelease

      - name: Unit tests (informational, after the APK is published)
        continue-on-error: true
        working-directory: src
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Commit the renamed source back to main
        run: |
          set -euo pipefail
          # Overlay the renamed tree onto this checkout as a normal commit.
          # .github is excluded (the Actions token may not create or update
          # workflow files) and rename.sh is excluded so the sync tool
          # survives on main.
          rsync -a --delete --exclude='.git' --exclude='.github' --exclude='rename.sh' src/ ./
          git config user.name "qavi-bootstrap"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Qavi: full rename of Mika v0.1.42 (bootstrap build)" || { echo "nothing to commit"; exit 0; }
          git push origin HEAD:main
